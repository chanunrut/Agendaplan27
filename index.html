.hd{touch-action:none;user-select:none;font-size:24px;color:var(--mute);padding:0 4px;cursor:grab;align-self:center}
.meta{font-size:14px;color:var(--mute)}.late{color:var(--bad);font-weight:700}

small{color:var(--mute)}
.empty{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--mute);font-size:15px}
.over{outline:3px dashed var(--pri);outline-offset:2px;border-radius:12px}
.bf{box-shadow:0 -4px 0 var(--pri)}.af{box-shadow:0 4px 0 var(--pri)}
.warn{background:#FCE4D2;border:1px solid #E9B48C;border-radius:12px;padding:10px;margin:6px 0;font-size:15px}
.hint{font-size:14px;color:var(--mute);margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:30px;font-weight:700;color:var(--pri);line-height:1.1}
.ov{position:fixed;inset:0;background:#2B1A1088;z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
label{display:block;font-size:15px;color:var(--mute);margin:8px 0 2px}

textarea{min-height:90px}input[type=range]{width:100%;accent-color:var(--pri)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lab{font-size:15px;color:var(--mute);margin-top:8px}
.ti{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.ti label{margin:0;color:var(--ink);font-size:16px}.ti input{width:20px;height:20px;accent-color:var(--ok);vertical-align:middle}
.st{text-decoration:line-through;color:var(--mute)}
.x{border:0;background:none;color:var(--mute);font-size:18px;padding:6px 10px}
.stb{border:0;background:none;font-size:26px;padding:0 6px;align-self:flex-start;cursor:pointer}
.pt{white-space:pre-wrap;font-size:15px;margin:6px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:20px;z-index:30;display:none;font-size:15px}

function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2000)}

`<div class="chips">${['ทั้งหมด',...P].map(p=>`<button class="chip ${S.flt==p?'on':''}" onclick="S.flt='${p}';R()">${p}</button>`).join('')}</div><button class="btn" onclick="editTask()">+ เพิ่มงาน</button><p class="hint">ลากที่ปุ่ม ⠿ เพื่อเรียงลำดับหรือย้ายสถานะ</p>`+
ST.map(s=>{const l=L.filter(t=>t.st==s);return`<section class="sec" data-st="${s}"><h3>${s}<span>${l.length}</span></h3>${l.map(card).join('')||'<div class="empty">ลากงานมาวางที่นี่</div>'}</section>`}).join('')}

let D=null;
function startDrag(e,id){e.preventDefault();const el=e.target.closest('.card'),r=el.getBoundingClientRect(),g=el.cloneNode(true);
g.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;z-index:99;pointer-events:none;box-shadow:0 8px 24px #0005`;document.body.appendChild(g);el.style.opacity=.3;D={id,g,dy:e.clientY-r.top}}
addEventListener('pointermove',e=>{if(!D)return;D.g.style.top=e.clientY-D.dy+'px';if(e.clientY<100)scrollBy(0,-14);if(e.clientY>innerHeight-110)scrollBy(0,14);
document.querySelectorAll('.over,.bf,.af').forEach(x=>x.classList.remove('over','bf','af'));
const t=document.elementFromPoint(e.clientX,e.clientY),c=t&&t.closest('.card'),s=t&&t.closest('.sec');
D.c=c&&c.dataset.id!=D.id?c.dataset.id:null;D.s=s?s.dataset.st:null;
if(D.c){D.after=e.clientY>c.getBoundingClientRect().top+c.offsetHeight/2;c.classList.add(D.after?'af':'bf')}else if(s)s.classList.add('over')});
function endDrag(ok){if(!D)return;const d=D;D=null;d.g.remove();
if(ok&&d.s){const i=S.tasks.findIndex(t=>t.id==d.id),t=S.tasks.splice(i,1)[0];t.st=d.s;if(d.s==ST[2])t.pr=100;
if(d.c){const j=S.tasks.findIndex(x=>x.id==d.c);S.tasks.splice(d.after?j+1:j,0,t)}else S.tasks.push(t);save()}R()}

function toCSV(r){return'\ufeff'+r.map(x=>x.map(v=>{v=String(v??'');return/[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n')}
function parseCSV(t){t=t.replace(/^\ufeff/,'');const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';rows.push(r);r=[]}else f+=c}
if(f||r.length){r.push(f);rows.push(r)}return rows.filter(r=>r.some(x=>x.trim()))}
function exp(k){let rows;

if(k=='wk')rows=[['วัน','เวลา','งาน','เกณฑ์สำเร็จ','แพลตฟอร์ม','ความคืบหน้า','สถานะ','หมายเหตุ']].concat(S.wk.map(x=>['วันที่ '+x.d,x.tm,x.t,x.cr,x.pl,x.st==ST[2]?100:0,x.st,x.n]));
if(k=='pr')rows=[['หมวด','ชื่อ','พรอมต์']].concat(S.pr.map(p=>[p.cat,p.title,p.text]));
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([toCSV(rows)],{type:'text/csv;charset=utf-8'}));a.download=`hairai-${k}-${today()}.csv`;document.body.appendChild(a);a.click();a.remove();toast('ส่งออกแล้ว ✓')}
const ci=(h,ns)=>h.findIndex(x=>ns.some(n=>x.toLowerCase().includes(n)));
function nd(v){v=(v||'').trim();let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]-(m[1]>2400?543:0)+'-'+pad(m[2])+'-'+pad(m[3]);
m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(m)return m[3]-(m[3]>2400?543:0)+'-'+pad(m[2])+'-'+pad(m[1]);return''}
function np(v){const o=new Set();String(v||'').toLowerCase().split(/[,;/|、]+/).forEach(x=>{if(/ทุก|all/.test(x))P.forEach(p=>o.add(p));if(/tiktok/.test(x))o.add(P[0]);if(/กลุ่ม|group/.test(x))o.add(P[3]);else if(/facebook|เฟซ|fb/.test(x))o.add(P[1]);if(/youtube|ยูทูบ/.test(x))o.add(P[2]);if(/live|ไลฟ์/.test(x))o.add(P[4])});return P.filter(p=>o.has(p))}
function impGo(){const f=$('#ifile').files[0];if(!f)return toast('กรุณาเลือกไฟล์ก่อน');const r=new FileReader();r.onload=()=>{try{imp(r.result,$('#itype').value)}catch(e){toast('อ่านไฟล์ไม่สำเร็จ')}};r.readAsText(f,'utf-8')}
function imp(txt,type){const rows=parseCSV(txt);if(!rows.length)return toast('ไฟล์ไม่มีข้อมูล');
const nh=/^วันที่\s*\d/.test(rows[0][0]);
if(type=='wk'||nh||(type=='auto'&&/เกณฑ์สำเร็จ/.test(rows[0].join()))){const h2=nh?[]:rows[0].map(x=>x.trim()),b2=nh?rows:rows.slice(1);
const c=nh?[0,1,2,3,4,5,6,7]:[['วัน','day'],['เวลา','time'],['งาน','กิจกรรม','title'],['เกณฑ์','criteria'],['แพลตฟอร์ม','platform'],['คืบหน้า','progress'],['สถานะ','status'],['หมายเหตุ','note']].map(x=>ci(h2,x));let k=0;
b2.forEach(r=>{const q=i=>i<0?'':(r[i]||'').trim(),t=q(c[2]);if(!t)return;const sv=q(c[6]),st=/เสร็จ|done|complete/i.test(sv)?ST[2]:/กำลัง|doing|progress/i.test(sv)?ST[1]:ST[0];
S.wk.push({id:uid(),d:Math.min(7,parseInt(q(c[0]).replace(/\D/g,''))||1),tm:q(c[1]),t,cr:q(c[3]),pl:q(c[4])||'ทุกแพลตฟอร์ม',st,n:q(c[7])});k++});
save();toast('นำเข้าแผน 7 วัน '+k+' รายการ ✓');S.page='wk';R();return}
if(rows.length<2)return toast('ไฟล์ไม่มีข้อมูล');const h=rows[0].map(x=>x.trim()),b=rows.slice(1),j=h.join('|').toLowerCase();
if(type=='auto')type=/ยอดวิว|views/.test(j)?'stats':/สคริปต์|script/.test(j)?'scripts':/พรอมต์|prompt/.test(j)?'pr':/สัปดาห์|week/.test(j)?'tl':'tasks';
const g=(r,i)=>i<0?'':(r[i]||'').trim();let n=0;
if(type=='tasks'){const c=[['ชื่องาน','งาน','title','task'],['วันเริ่ม','start'],['กำหนด','due'],['สถานะ','status'],['คืบหน้า','progress','%'],['หมายเหตุ','note'],['แพลตฟอร์ม','platform'],['รอบ']].map(x=>ci(h,x));
b.forEach(r=>{const title=g(r,c[0]!=-1?c[0]:0);if(!title)return;const sv=g(r,c[3]),due=g(r,c[2]);
const st=/เสร็จ|done|complete/i.test(sv)?ST[2]:/กำลัง|doing|progress/i.test(sv)?ST[1]:ST[0];let pr=parseInt(g(r,c[4]))||0;if(st==ST[2])pr=100;
S.tasks.push({id:uid(),title,s:nd(g(r,c[1])),d:nd(due),st,pr:Math.min(100,pr),note:g(r,c[5]),pl:np(g(r,c[6])),rec:g(r,c[7])||(nd(due)?'':due)});n++})}
if(type=='stats'){const c=[['วันที่','date'],['ชื่อ','คลิป','title'],['แพลตฟอร์ม','platform'],['วิว','view'],['คอมเมนต์','comment'],['แชร์','share'],['บันทึก','save'],['ติดตาม','follow'],['หมายเหตุ','note']].map(x=>ci(h,x));
b.forEach(r=>{const t=g(r,c[1]);if(!t)return;const pl=np(g(r,c[2]))[0]||g(r,c[2])||P[0],N=i=>parseInt(g(r,i).replace(/,/g,''))||0;
S.stats.push({id:uid(),d:nd(g(r,c[0]))||today(),t,p:pl,v:N(c[3]),c:N(c[4]),sh:N(c[5]),sv:N(c[6]),f:N(c[7]),n:g(r,c[8])});n++})}
if(type=='tl'){const c=[ci(h,['เดือน','month']),ci(h,['สัปดาห์','week']),ci(h,['หัวข้อ','เนื้อหา','topic','รายการ','คลิป']),ci(h,['เสร็จ','done'])];
b.forEach(r=>{const l=[g(r,c[0]),g(r,c[1])].filter(Boolean).join(' ')||g(r,0),tp=g(r,c[2]>=0?c[2]:h.length-1);if(!l)return;let w=S.tl.find(x=>x.l==l);if(!w){w={id:uid(),l,i:[]};S.tl.push(w)}
tp.split(/[,;、|\n]/).map(x=>x.trim()).filter(Boolean).forEach(t=>{w.i.push({t,d:/ใช่|true|1|done/i.test(g(r,c[3]))});n++})})}
if(type=='pr'||type=='scripts'){const c=[ci(h,['หมวด','category']),ci(h,['ชื่อ','หัวข้อ','คลิป','title']),ci(h,['พรอมต์','prompt','สคริปต์','script','เนื้อหา','ข้อความ','บท'])];
b.forEach(r=>{const title=g(r,c[1]>=0?c[1]:0),text=(r[c[2]>=0?c[2]:r.length-1]||'').trim();if(!title&&!text)return;
const cat=type=='scripts'?CATS[4]:CATS.find(x=>g(r,c[0]).includes(x))||g(r,c[0])||CATS[0];if(!CATS.includes(cat))CATS.push(cat);S.pr.push({id:uid(),cat,title:title||text.slice(0,30),text});n++})}
save();toast(`นำเข้า ${n} รายการ ✓`);S.page={tasks:'tasks',stats:'stats',tl:'tl',pr:'pr',scripts:'pr'}[type];R()}

async function call(b){const r=await fetch(S.set.url,b?{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)}:{});return r.json()}
async function sync(manual){if(!S.set.url||S.busy||D)return;S.busy=1;try{const r=await call(),m=S.mod||0;
if(r.mod>m){unpack(r);S.mod=r.mod;save(1);R();toast('ดึงข้อมูลจาก Sheets แล้ว ✓')}
else if(m>r.mod||!r.tabs['งาน']){await call({mod:m||(S.mod=Date.now()),tabs:pack()});if(manual)toast('ส่งขึ้น Sheets แล้ว ✓')}
else if(manual)toast('ข้อมูลตรงกันแล้ว ✓');S.set.at=Date.now();save(1)}catch(e){if(manual)toast('เชื่อมต่อ Sheets ไม่ได้ ตรวจลิงก์และสิทธิ์')}S.busy=0;if(manual)R()}
async function forceSync(up){if(!confirm(up?'ส่งข้อมูลในแอปขึ้นไปทับชีต?':'ดึงข้อมูลจากชีตมาทับในแอป?'))return;S.busy=1;try{if(up){S.mod=Date.now();await call({mod:S.mod,tabs:pack()})}else{const r=await call();unpack(r);S.mod=r.mod}S.set.at=Date.now();save(1);toast('เรียบร้อย ✓')}catch(e){toast('เชื่อมต่อไม่ได้')}S.busy=0;R()}
function syncBox(){const u=S.set.url||'';return`<h3>ซิงก์ Google Sheets อัตโนมัติ</h3><div class="box"><label>ลิงก์ Web App (ลงท้าย /exec)<input value="${esc(u)}" placeholder="https://script.google.com/macros/s/…/exec" onchange="S.set.url=this.value.trim();save(1);sync(1)"></label>${u?`<small>ซิงก์ล่าสุด: ${S.set.at?new Date(S.set.at).toLocaleTimeString('th-TH'):'ยังไม่เคย'}</small><button class="btn sm" onclick="sync(1)">ซิงก์ตอนนี้</button><div class="two"><button class="btn sm ghost" onclick="forceSync(1)">ส่งขึ้น (ทับชีต)</button><button class="btn sm ghost" onclick="forceSync(0)">ดึงลง (ทับแอป)</button></div>`:''}</div>`}
/* ---------- เริ่มทำงาน ---------- */
const V={wk:vWk,tasks:vTasks,ov:vOv,tl:vTl,stats:vStats,pr:vPr,csv:vCsv,nt:vNt};
function R(){$('#app').innerHTML=V[S.page]();$('#ttl').textContent=PG.find(p=>p[0]==S.page)[3];
$('#nav').innerHTML=PG.map(p=>`<button class="${S.page==p[0]?'on':''}" onclick="S.page='${p[0]}';M();R();scrollTo(0,0)"><b>${p[1]}</b>${p[2]}</button>`).join('')}
R();chk();sync();setInterval(()=>sync(),60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
</script></body></html>
